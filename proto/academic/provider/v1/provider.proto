syntax = "proto3";

package academic.provider.v1;

// The generated package is intentionally outside internal/. It is the
// versioned service contract shared by campus-platform and the independently
// deployed academic service.
option go_package = "github.com/LDouble/campus-academic-api/pkg/academic/provider/v1;academicproviderv1";

import "google/protobuf/timestamp.proto";

service AcademicProviderService {
  rpc VerifyCredential(VerifyCredentialRequest) returns (VerifyCredentialResponse);
  // VerifyManagedCredential 仅验证托管凭据，不建立长期会话。
  rpc VerifyManagedCredential(VerifyManagedCredentialRequest) returns (VerifyManagedCredentialResponse);
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
  rpc GetCourseSelectionSchedule(GetCourseSelectionScheduleRequest) returns (GetCourseSelectionScheduleResponse);
  rpc ListGrades(ListGradesRequest) returns (ListGradesResponse);
  rpc ListExams(ListExamsRequest) returns (ListExamsResponse);
  rpc ListCourseSelections(ListCourseSelectionsRequest) returns (ListCourseSelectionsResponse);
  rpc ListCourseAdditionResults(ListCourseAdditionResultsRequest) returns (ListCourseAdditionResultsResponse);
  rpc ListCourseCatalogPage(ListCourseCatalogPageRequest) returns (ListCourseCatalogPageResponse);
  rpc GetTrainingPlan(GetTrainingPlanRequest) returns (GetTrainingPlanResponse);
  rpc DeleteStudentSessions(DeleteStudentSessionsRequest) returns (DeleteStudentSessionsResponse);
}

message Credential {
  string student_no = 1;
  string password = 2;
}

message StudentReference {
  uint64 user_id = 1;
  string student_no = 2;
  string provider = 3;
  string education_level = 4;
  // 托管账号执行使用 account_id 且 user_id 为零；普通查询允许二者均为零，禁止二者同时非零。
  uint64 account_id = 5;
}

message VerifyCredentialRequest {
  Credential credential = 1;
  string education_level = 2;
}

message VerifyCredentialResponse {
  string real_name = 1;
  string provider = 2;
  string education_level = 3;
}

message VerifyManagedCredentialRequest {
  Credential credential = 1;
  string education_level = 2;
}

message VerifyManagedCredentialResponse {
  string real_name = 1;
  string provider = 2;
  string education_level = 3;
}

message ListCoursesRequest {
  StudentReference student = 1;
  Credential credential = 2;
  string period_id = 3;
}

message ListCoursesResponse {
  repeated Course courses = 1;
	CacheMetadata cache = 2;
	string schedule_note = 3;
}

// CacheMetadata is present only when the response was served from the
// provider's encrypted Redis result cache.
message CacheMetadata {
	string state = 1;
	google.protobuf.Timestamp cached_at = 2;
	google.protobuf.Timestamp fresh_until = 3;
}

message Course {
  string id = 1;
  string period_id = 2;
  string course_code = 3;
  string name = 4;
  string teacher = 5;
  string campus = 6;
  string location = 7;
  int32 weekday = 8;
  int32 start_section = 9;
  int32 end_section = 10;
  repeated int32 weeks = 11;
  string note = 12;
  // ClassNum is the school course-selection number. It is distinct from the
  // course code and is used by clients to reconcile simulated selections.
  string class_num = 13;
}

message GetCourseSelectionScheduleRequest {
  StudentReference student = 1;
  Credential credential = 2;
  string period_id = 3;
}

message GetCourseSelectionScheduleResponse {
  repeated Course courses = 1;
  CacheMetadata cache = 2;
  string schedule_note = 3;
}

message ListGradesRequest {
  StudentReference student = 1;
  Credential credential = 2;
  string period_id = 3;
}

message ListGradesResponse {
  repeated Grade grades = 1;
	CacheMetadata cache = 2;
}

message Grade {
  string id = 1;
  string period_id = 2;
  string course_code = 3;
  string course_name = 4;
  string course_type = 5;
  double credit = 6;
  string grade_type = 7;
  optional double score = 8;
  optional string grade_level = 9;
}

message ListExamsRequest {
  StudentReference student = 1;
  Credential credential = 2;
  string period_id = 3;
}

message ListExamsResponse {
  repeated Exam exams = 1;
	CacheMetadata cache = 2;
}

message Exam {
  string id = 1;
  string period_id = 2;
  string course_code = 3;
  string course_name = 4;
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
  string campus = 7;
  string location = 8;
  string seat = 9;
  string phase = 10;
  string method = 11;
  string materials = 12;
  string notice = 13;
}

message ListCourseSelectionsRequest {
  StudentReference student = 1;
  Credential credential = 2;
  string period_id = 3;
}

message ListCourseSelectionsResponse {
  repeated CourseSelection selections = 1;
	CacheMetadata cache = 2;
}

message CourseSelection {
  string id = 1;
  string period_id = 2;
  string course_code = 3;
  string course_name = 4;
  string course_type = 5;
  double credit = 6;
  string teacher = 7;
  string campus = 8;
  string location = 9;
  string schedule = 10;
  int32 capacity = 11;
  int32 enrolled = 12;
  string status = 13;
  optional google.protobuf.Timestamp selected_at = 14;
  optional string result_text = 15;
  optional string note = 16;
}

message ListCourseAdditionResultsRequest {
  StudentReference student = 1;
  Credential credential = 2;
  string period_id = 3;
}

message ListCourseAdditionResultsResponse {
  repeated CourseAdditionResult results = 1;
  CacheMetadata cache = 2;
}

// CourseAdditionResult is one undergraduate course-addition application
// result. It deliberately excludes student identity fields (xh, xm) and
// upstream flags whose semantics are not defined (sfbmdsq, sftsqk).
message CourseAdditionResult {
  string id = 1;
  string period_id = 2;
  // PeriodName is the upstream display name of the period, kept separate from
  // the period ID so clients never derive spring/autumn from the ID.
  string period_name = 3;
  string course_code = 4;
  string course_name = 5;
  string selection_code = 6;
  string teacher = 7;
  string teaching_class = 8;
  // AuditText is the authoritative review-status text returned verbatim by
  // the school (e.g. "审核中"). Unknown values are preserved, never coerced.
  string audit_text = 9;
}

message DeleteStudentSessionsRequest {
  string student_no = 1;
}

message DeleteStudentSessionsResponse {}

message ListCourseCatalogPageRequest {
  Credential credential = 1;
  string education_level = 2;
  string period_id = 3;
  int32 page = 4;
}

message ListCourseCatalogPageResponse {
  repeated CourseCatalogEntry entries = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
  int32 total_pages = 5;
  bool has_more = 6;
}

message CourseCatalogEntry {
  string source_key = 1;
  string period_id = 2;
  string opening_code = 3;
  string course_code = 4;
  string course_name = 5;
  string course_type = 6;
  string department = 7;
  string teachers = 8;
  string campus = 9;
  string classes = 10;
  string schedule = 11;
  string location = 12;
  string language = 13;
  int32 capacity = 14;
  int32 enrolled = 15;
  string note = 16;
}

// GetTrainingPlanRequest 查询已认证学生的培养方案，不按学期筛选。
message GetTrainingPlanRequest {
  StudentReference student = 1;
  Credential credential = 2;
}

message GetTrainingPlanResponse {
  TrainingPlan plan = 1;
}

// TrainingPlan 的体系名称和数量随专业变化，不使用固定分类枚举。
message TrainingPlan {
  string title = 1;
  string objectives = 2;
  string description = 3;
  repeated TrainingPlanCourseGroup course_groups = 4;
  repeated TrainingPlanCreditRequirement credit_requirements = 5;
  double total_required_credit = 6;
  optional string major_name = 7;
  optional int32 cohort_year = 8;
}

message TrainingPlanCourseGroup {
  string name = 1;
  bool courses_omitted = 2;
  repeated TrainingPlanCourse courses = 3;
}

message TrainingPlanCourse {
  string selection_group = 1;
  string course_code = 2;
  string course_name = 3;
  string course_nature = 4;
  string course_attribute = 5;
  double credit = 6;
  double lecture_hours = 7;
  double practice_hours = 8;
  double total_hours = 9;
  // OfferedTerms 保留教务原始开设学期编号和顺序。
  repeated string offered_terms = 10;
}

message TrainingPlanCreditRequirement {
  string group_name = 1;
  string course_attribute = 2;
  double required_credit = 3;
}
