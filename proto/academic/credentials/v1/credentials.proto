syntax = "proto3";

package academic.credentials.v1;

option go_package = "github.com/LDouble/campus-academic-api/pkg/academic/credentials/v1;academiccredentialsv1";

import "academic/provider/v1/provider.proto";
import "google/protobuf/timestamp.proto";

// CredentialsService 仅管理托管凭据及受控取用；实现层必须执行内部 mTLS 身份策略。
service CredentialsService {
  // 凭据元数据和受控取用不承担业务任务或调度状态。
  // GetCredentialMetadata 与账号级读取、录制及状态变更共用相同的元数据响应结构。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetCredentialMetadata(GetCredentialMetadataRequest) returns (GetCredentialMetadataResponse);
  rpc ListCredentialMetadata(ListCredentialMetadataRequest) returns (ListCredentialMetadataResponse);
  // 按教务账号读取托管凭据元数据；服务端要求 account 与 account_id 恰有一个。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetAccountCredential(GetAccountCredentialRequest) returns (GetCredentialMetadataResponse);
  // 按账号 ID 分页列出托管凭据元数据，不返回凭据明文。
  rpc ListAccountCredentials(ListAccountCredentialsRequest) returns (ListAccountCredentialsResponse);
  // 仅受信 Provider mTLS 身份可调用，且只可录制其本次实际验证成功的候选凭据；服务端执行版本比较和幂等校验。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc CaptureVerifiedCredential(CaptureVerifiedCredentialRequest) returns (GetCredentialMetadataResponse);
  // 仅接受经 Backend 管理权限授权转发的账号状态变更；服务端按 operation_id 对请求内容幂等。
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc SetAccountCredentialState(SetAccountCredentialStateRequest) returns (GetCredentialMetadataResponse);
  rpc ResolveCredential(ResolveCredentialRequest) returns (ResolveCredentialResponse);
  rpc ValidateCredentialUse(ValidateCredentialUseRequest) returns (ValidateCredentialUseResponse);
  rpc ReportCredentialHealth(ReportCredentialHealthRequest) returns (ReportCredentialHealthResponse);
  rpc CreateBindingIntent(CreateBindingIntentRequest) returns (CreateBindingIntentResponse);
  rpc GetHostingStatus(GetHostingStatusRequest) returns (GetHostingStatusResponse);
  // 已停用；仅保留 wire 兼容，服务端不提供实现或授权。
  rpc UpdateGrant(UpdateGrantRequest) returns (UpdateGrantResponse) { option deprecated = true; }
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc FenceSubject(FenceSubjectRequest) returns (FenceSubjectResponse);
  // 以下旧任务 RPC 已停用；仅保留 wire 兼容，服务端不提供实现或授权。
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) { option deprecated = true; }
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) { option deprecated = true; }
  rpc LeaseTask(LeaseTaskRequest) returns (LeaseTaskResponse) { option deprecated = true; }
  rpc ResolveTaskCredential(ResolveTaskCredentialRequest) returns (ResolveTaskCredentialResponse) { option deprecated = true; }
  rpc CheckExecutionAdmission(CheckExecutionAdmissionRequest) returns (CheckExecutionAdmissionResponse) { option deprecated = true; }
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) { option deprecated = true; }
}

// AcademicCredentialAuthorityService 提供强一致身份资格边界；实现层必须执行内部 mTLS 身份策略。
service AcademicCredentialAuthorityService {
  rpc GetEligibility(GetEligibilityRequest) returns (GetEligibilityResponse);
  rpc ConfirmBinding(ConfirmBindingRequest) returns (ConfirmBindingResponse);
  // 通用访问票据由平台签发；凭据服务只核对引用和访问权限。
  rpc AuthorizeCredentialAccess(AuthorizeCredentialAccessRequest) returns (AuthorizeCredentialAccessResponse);
}

// CredentialReference 精确引用某个用户的凭据与身份代际，不包含秘密。
message CredentialReference {
  uint64 user_id = 1;
  string credential_id = 2;
  uint64 credential_revision = 3;
  uint64 grant_epoch = 4;
  uint64 identity_version = 5;
  // AccountID 是教务账号托管模式的主体；账号模式下 user_id 和 identity_version 必须为零。
  uint64 account_id = 6;
}

message CredentialMetadata {
  CredentialReference reference = 1;
  string provider = 2;
  string education_level = 3;
  string state = 4;
  // Account 是账号托管凭据的稳定业务键；账号记录必须同时提供 account_id 和 account。
  AccountKey account = 5;
}

// AccountKey 以学校、学历类型和规范化学号共同唯一标识一个教务账号。
message AccountKey {
  string provider = 1;
  string education_level = 2;
  string student_no = 3;
}

message GetCredentialMetadataRequest { uint64 user_id = 1; }
message GetCredentialMetadataResponse { CredentialMetadata credential = 1; }

message ListCredentialMetadataRequest {
  uint64 after_user_id = 1;
  // 首次为零；后续使用首个响应的上界，不纳入更大的用户 ID。
  uint64 max_user_id = 2;
  uint32 page_size = 3;
  string provider = 4;
  string education_level = 5;
}
message ListCredentialMetadataResponse {
  repeated CredentialMetadata credentials = 1;
  uint64 max_user_id = 2;
  uint64 next_after_user_id = 3;
  bool has_more = 4;
}

message GetAccountCredentialRequest {
  // Account 和 account_id 必须恰有一个；两者都传或都不传均为无效请求。
  AccountKey account = 1;
  uint64 account_id = 2;
}

message ListAccountCredentialsRequest {
  uint64 after_account_id = 1;
  // 首次为零；后续使用首个响应的上界，不纳入更大的账号 ID。
  uint64 max_account_id = 2;
  uint32 page_size = 3;
  string provider = 4;
  string education_level = 5;
}

message ListAccountCredentialsResponse {
  repeated CredentialMetadata credentials = 1;
  uint64 max_account_id = 2;
  uint64 next_after_account_id = 3;
  bool has_more = 4;
}

message CaptureVerifiedCredentialRequest {
  AccountKey account = 1;
  // 只允许来自 Provider 实际验证成功的本次候选，不得由缓存或旧会话推断。
  academic.provider.v1.Credential credential = 2;
  uint64 expected_revision = 3;
  google.protobuf.Timestamp verified_at = 4;
  // 验证操作的稳定不透明 ID，用于防止重放和约束录制幂等性。
  string verification_id = 5;
}

message SetAccountCredentialStateRequest {
  uint64 account_id = 1;
  uint64 expected_revision = 2;
  // Action 仅允许 disable、enable、delete。
  string action = 3;
  // 同一 operation_id 必须绑定相同账号、版本和 action。
  string operation_id = 4;
}

message ResolveCredentialRequest {
  CredentialReference reference = 1;
  // 短期一次性票据不得写入日志或队列。
  string access_token = 2;
}
message ResolveCredentialResponse {
  CredentialReference reference = 1;
  Subject subject = 2;
  academic.provider.v1.Credential credential = 3;
}
message ValidateCredentialUseRequest { CredentialReference reference = 1; }
message ValidateCredentialUseResponse {
  bool allowed = 1;
  string error_code = 2;
}
message ReportCredentialHealthRequest {
  CredentialReference reference = 1;
  // 仅接受凭据失效或需要人工处理，不接受网络及业务错误。
  string state = 2;
}
message ReportCredentialHealthResponse { bool acknowledged = 1; }

message AuthorizeCredentialAccessRequest {
  CredentialReference reference = 1;
  string access_token = 2;
  string caller_uri = 3;
  string operation_id = 4;
}
message AuthorizeCredentialAccessResponse {
  bool allowed = 1;
  Subject subject = 2;
  // AccessId 是可用于通用防重放的稳定不透明标识。
  string access_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  string operation_id = 5;
  string error_code = 6;
}

message Subject {
  uint64 user_id = 1;
  string student_no = 2;
  string provider = 3;
  string education_level = 4;
  uint64 identity_version = 5;
  // AccountID 是账号托管模式的主体；账号模式下 user_id 和 identity_version 必须为零。
  uint64 account_id = 6;
}

message HostingStatus {
  // Enabled 表示托管功能当前可用。
  bool enabled = 1;
  string credential_id = 2;
  uint64 revision = 3;
  // State 取值为 none、active、reauth_required、action_required 或 revoked。
  string state = 4;
  bool automatic_sync = 5;
  // PolicyVersion 是服务端生效的策略版本。
  string policy_version = 6;
  google.protobuf.Timestamp last_sync_at = 7;
  string last_error_code = 8;
  bool revocation_pending = 9;
}

message CreateBindingIntentRequest {
  uint64 user_id = 1;
  string education_level = 2;
  uint64 expected_revision = 3;
  reserved 4 to 6;
  reserved "consent_version", "foreground_consent", "background_consent";
}

message CreateBindingIntentResponse {
  string intent_id = 1;
  string submit_url = 2;
  string token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetHostingStatusRequest {
  uint64 user_id = 1;
}

message GetHostingStatusResponse {
  HostingStatus status = 1;
}

message UpdateGrantRequest {
  uint64 user_id = 1;
  uint64 expected_revision = 2;
  bool automatic_sync = 3;
}

message UpdateGrantResponse {
  HostingStatus status = 1;
}

message RevokeCredentialRequest {
  uint64 user_id = 1;
  uint64 expected_revision = 2;
}

message RevokeCredentialResponse {
  HostingStatus status = 1;
}

message FenceSubjectRequest {
  uint64 user_id = 1;
  uint64 identity_version = 2;
}

message FenceSubjectResponse {
  bool acknowledged = 1;
}

message CreateTaskRequest {
  uint64 user_id = 1;
  // 后台自动任务每日仅创建 courses 和 exams；其他只读查询由用户主动触发。
  string purpose = 2;
  string period_id = 3;
  string idempotency_key = 4;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  uint64 user_id = 1;
  string task_id = 2;
}

message GetTaskResponse {
  Task task = 1;
}

message Task {
  string task_id = 1;
  string purpose = 2;
  string period_id = 3;
  string state = 4;
  uint64 credential_revision = 5;
  uint64 grant_epoch = 6;
  string error_code = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  TaskResult result = 10;
}

message TaskResult {
  // 前台用户可主动查询所有既有只读结果；后台定时任务只允许 courses 和 exams。
  oneof result {
    academic.provider.v1.ListCoursesResponse courses = 1;
    academic.provider.v1.ListExamsResponse exams = 2;
    academic.provider.v1.ListGradesResponse grades = 3;
    academic.provider.v1.ListCourseSelectionsResponse course_selections = 4;
    academic.provider.v1.GetCourseSelectionScheduleResponse course_selection_schedule = 5;
    academic.provider.v1.ListCourseAdditionResultsResponse course_addition_results = 6;
  }
}

// Worker 由内部客户端证书识别，因此请求不携带用户身份。
message LeaseTaskRequest {}

message LeaseTaskResponse {
  // Task 为空表示当前没有可执行任务。
  Task task = 1;
  string lease_token = 2;
  uint64 fence = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ResolveTaskCredentialRequest {
  string task_id = 1;
  string lease_token = 2;
  uint64 fence = 3;
}

message ResolveTaskCredentialResponse {
  Subject subject = 1;
  academic.provider.v1.Credential credential = 2;
  string credential_id = 3;
  uint64 credential_revision = 4;
  uint64 grant_epoch = 5;
}

message CheckExecutionAdmissionRequest {
  string task_id = 1;
  string lease_token = 2;
  uint64 fence = 3;
  // Phase 取值为 external、result 或 session，表示本次需要准入的副作用阶段。
  string phase = 4;
}

message CheckExecutionAdmissionResponse {
  bool allowed = 1;
}

message CompleteTaskRequest {
  string task_id = 1;
  string lease_token = 2;
  uint64 fence = 3;
  TaskResult result = 4;
  string error_code = 5;
}

message CompleteTaskResponse {
  Task task = 1;
}

message GetEligibilityRequest {
  uint64 user_id = 1;
  string purpose = 2;
  // 每次请求使用新的 operation_id；资格从强一致数据库读取，结果不缓存。
  string operation_id = 3;
}

message GetEligibilityResponse {
  bool eligible = 1;
  Subject subject = 2;
  string operation_id = 3;
  string reason_code = 4;
}

// ConfirmBindingRequest 中的身份字段必须与已验证身份精确匹配。
// ConfirmBindingRequest 的身份必须精确匹配已验证身份，不得覆盖原认证方式、角色或状态；首次身份事务由后端负责。
message ConfirmBindingRequest {
  uint64 user_id = 1;
  string intent_id = 2;
  string student_no = 3;
  string real_name = 4;
  string provider = 5;
  string education_level = 6;
}

message ConfirmBindingResponse {
  bool eligible = 1;
  Subject subject = 2;
  string reason_code = 3;
}
