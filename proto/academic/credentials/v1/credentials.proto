syntax = "proto3";

package academic.credentials.v1;

option go_package = "github.com/LDouble/campus-academic-api/pkg/academic/credentials/v1;academiccredentialsv1";

import "academic/provider/v1/provider.proto";
import "google/protobuf/timestamp.proto";

// CredentialsService 管理托管凭据、执行任务和准入；实现层必须执行内部 mTLS 身份策略。
service CredentialsService {
  rpc CreateBindingIntent(CreateBindingIntentRequest) returns (CreateBindingIntentResponse);
  rpc GetHostingStatus(GetHostingStatusRequest) returns (GetHostingStatusResponse);
  rpc UpdateGrant(UpdateGrantRequest) returns (UpdateGrantResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc FenceSubject(FenceSubjectRequest) returns (FenceSubjectResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc LeaseTask(LeaseTaskRequest) returns (LeaseTaskResponse);
  rpc ResolveTaskCredential(ResolveTaskCredentialRequest) returns (ResolveTaskCredentialResponse);
  rpc CheckExecutionAdmission(CheckExecutionAdmissionRequest) returns (CheckExecutionAdmissionResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
}

// AcademicCredentialAuthorityService 提供强一致身份资格边界；实现层必须执行内部 mTLS 身份策略。
service AcademicCredentialAuthorityService {
  rpc GetEligibility(GetEligibilityRequest) returns (GetEligibilityResponse);
  rpc ConfirmBinding(ConfirmBindingRequest) returns (ConfirmBindingResponse);
}

message Subject {
  uint64 user_id = 1;
  string student_no = 2;
  string provider = 3;
  string education_level = 4;
  uint64 identity_version = 5;
}

message HostingStatus {
  // Enabled 表示托管功能当前可用。
  bool enabled = 1;
  string credential_id = 2;
  uint64 revision = 3;
  // State 取值为 none、active、reauth_required、action_required 或 revoked。
  string state = 4;
  bool automatic_sync = 5;
  // PolicyVersion 是服务端生效的策略版本。
  string policy_version = 6;
  google.protobuf.Timestamp last_sync_at = 7;
  string last_error_code = 8;
  bool revocation_pending = 9;
}

message CreateBindingIntentRequest {
  uint64 user_id = 1;
  string education_level = 2;
  uint64 expected_revision = 3;
  reserved 4 to 6;
  reserved "consent_version", "foreground_consent", "background_consent";
}

message CreateBindingIntentResponse {
  string intent_id = 1;
  string submit_url = 2;
  string token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message GetHostingStatusRequest {
  uint64 user_id = 1;
}

message GetHostingStatusResponse {
  HostingStatus status = 1;
}

message UpdateGrantRequest {
  uint64 user_id = 1;
  uint64 expected_revision = 2;
  bool automatic_sync = 3;
}

message UpdateGrantResponse {
  HostingStatus status = 1;
}

message RevokeCredentialRequest {
  uint64 user_id = 1;
  uint64 expected_revision = 2;
}

message RevokeCredentialResponse {
  HostingStatus status = 1;
}

message FenceSubjectRequest {
  uint64 user_id = 1;
  uint64 identity_version = 2;
}

message FenceSubjectResponse {
  bool acknowledged = 1;
}

message CreateTaskRequest {
  uint64 user_id = 1;
  // 后台自动任务每日仅创建 courses 和 exams；其他只读查询由用户主动触发。
  string purpose = 2;
  string period_id = 3;
  string idempotency_key = 4;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  uint64 user_id = 1;
  string task_id = 2;
}

message GetTaskResponse {
  Task task = 1;
}

message Task {
  string task_id = 1;
  string purpose = 2;
  string period_id = 3;
  string state = 4;
  uint64 credential_revision = 5;
  uint64 grant_epoch = 6;
  string error_code = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  TaskResult result = 10;
}

message TaskResult {
  // 前台用户可主动查询所有既有只读结果；后台定时任务只允许 courses 和 exams。
  oneof result {
    academic.provider.v1.ListCoursesResponse courses = 1;
    academic.provider.v1.ListExamsResponse exams = 2;
    academic.provider.v1.ListGradesResponse grades = 3;
    academic.provider.v1.ListCourseSelectionsResponse course_selections = 4;
    academic.provider.v1.GetCourseSelectionScheduleResponse course_selection_schedule = 5;
    academic.provider.v1.ListCourseAdditionResultsResponse course_addition_results = 6;
  }
}

// Worker 由内部客户端证书识别，因此请求不携带用户身份。
message LeaseTaskRequest {}

message LeaseTaskResponse {
  // Task 为空表示当前没有可执行任务。
  Task task = 1;
  string lease_token = 2;
  uint64 fence = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ResolveTaskCredentialRequest {
  string task_id = 1;
  string lease_token = 2;
  uint64 fence = 3;
}

message ResolveTaskCredentialResponse {
  Subject subject = 1;
  academic.provider.v1.Credential credential = 2;
  string credential_id = 3;
  uint64 credential_revision = 4;
  uint64 grant_epoch = 5;
}

message CheckExecutionAdmissionRequest {
  string task_id = 1;
  string lease_token = 2;
  uint64 fence = 3;
  // Phase 取值为 external、result 或 session，表示本次需要准入的副作用阶段。
  string phase = 4;
}

message CheckExecutionAdmissionResponse {
  bool allowed = 1;
}

message CompleteTaskRequest {
  string task_id = 1;
  string lease_token = 2;
  uint64 fence = 3;
  TaskResult result = 4;
  string error_code = 5;
}

message CompleteTaskResponse {
  Task task = 1;
}

message GetEligibilityRequest {
  uint64 user_id = 1;
  string purpose = 2;
  // 每次请求使用新的 operation_id；资格从强一致数据库读取，结果不缓存。
  string operation_id = 3;
}

message GetEligibilityResponse {
  bool eligible = 1;
  Subject subject = 2;
  string operation_id = 3;
  string reason_code = 4;
}

// ConfirmBindingRequest 中的身份字段必须与已验证身份精确匹配。
// ConfirmBindingRequest 的身份必须精确匹配已验证身份，不得覆盖原认证方式、角色或状态；首次身份事务由后端负责。
message ConfirmBindingRequest {
  uint64 user_id = 1;
  string intent_id = 2;
  string student_no = 3;
  string real_name = 4;
  string provider = 5;
  string education_level = 6;
}

message ConfirmBindingResponse {
  bool eligible = 1;
  Subject subject = 2;
  string reason_code = 3;
}
