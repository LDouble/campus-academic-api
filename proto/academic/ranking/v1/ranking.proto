syntax = "proto3";

package academic.ranking.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/LDouble/campus-academic-api/pkg/academic/ranking/v1;academicrankingv1";

// AcademicRankingService is private to authenticated platform services. The
// caller is responsible for membership and delegation authorization.
service AcademicRankingService {
  rpc GetStudentSnapshot(GetStudentSnapshotRequest) returns (GetStudentSnapshotResponse);
  rpc CalculateRanking(CalculateRankingRequest) returns (CalculateRankingResponse);
}

message StudentRef {
  string provider = 1;
  string education_level = 2;
  string student_no = 3;
}
message StudentProfile {
  string college_code = 1;
  string college_name = 2;
  string major_code = 3;
  string major_name = 4;
  int32 admission_year = 5;
  string class_code = 6;
  string class_name = 7;
  google.protobuf.Timestamp observed_at = 8;
}
message SnapshotPeriod {
  string period_id = 1;
  google.protobuf.Timestamp observed_at = 2;
}
message GetStudentSnapshotRequest {
  StudentRef student = 1;
}
message GetStudentSnapshotResponse {
  StudentProfile profile = 1;
  repeated SnapshotPeriod periods = 2;
  google.protobuf.Timestamp source_cutoff_at = 3;
}
message RankingParticipant {
  uint64 user_id = 1;
  StudentRef student = 2;
}
message CalculateRankingRequest {
  string rule_json = 1;
  repeated RankingParticipant participants = 2;
  repeated string period_ids = 3;
}
message RankingItem {
  uint64 user_id = 1;
  int64 score_x100 = 2;
  int64 credit_x100 = 3;
  string detail_json = 4;
  string status = 5;
  repeated string missing_periods = 6;
  int64 rank = 7;
  int64 tied_count = 8;
  int64 total_count = 9;
}
message CalculateRankingResponse {
  repeated RankingItem items = 1;
  google.protobuf.Timestamp source_cutoff_at = 2;
  string input_hash = 3;
}
